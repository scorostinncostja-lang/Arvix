# Настройки по умолчанию. Перекрываются файлом ~/.config/arvix/config.toml
# (его пишет `arvix setup`). Имена моделей живут только здесь и в конфиге
# пользователя — в коде их нет (правило №4).

timezone = "Europe/Moscow"
vault = ""            # путь к Obsidian-хранилищу
home = "~/Arvix"      # папка, где Claude Code запускается в режиме Arvix

[telegram]
token = ""
owner_id = 0
# Ответ головы — одним сообщением (D46); прежние bubble_* больше не читаются.

# Где в хранилище живут файлы Arvix. Пути — от корня хранилища.
# Чужие заметки Arvix только дополняет; перезаписывает лишь свои и нетронутые.
[vault_paths]
profile = "05_System/Профиль Arvix.md"
goals = "05_System/Цели"
roadmaps = "03_Resources/Роадмапы"
notes = "03_Resources/Обучение"     # каркасы конспектов, если нет папки предмета
weekly = "05_System/Недели"
inbox = "05_System/Inbox.md"
system = "05_System/Арвикс"         # журнал, инсайты, бэкапы
daily = ""                          # пусто — папка ежедневных заметок из настроек Obsidian
daily_template = ""                 # пусто — шаблон из настроек Obsidian
projects = "01_Projects"            # карточки проектов (портфолио) — блоком Arvix в заметке проекта

[schedule]
brief = "auto"          # auto = время подъёма из профиля + 15 мин
midday = "15:00"        # чек-ин, если к этому времени выполнено < 40%
debrief = "22:30"
curiosity = "18:30"     # Arvix пишет первым: вопрос про то, что помнит; "" — выключено
retro_weekday = 6       # 0 = пн … 6 = вс
retro = "20:00"
rollover = "04:00"      # вчерашний день закрывается в 04:00
bedtime_warning_min = 30
silent_weekday = -1     # -1 = автоматических тихих дней нет

[brain]
claude_bin = "claude"
timeout_sec = 180
effort = "auto"         # усилие модели (D40): auto — код решает по сообщению (план, «почему», учёба — medium, остальное — low);
                        # low | medium | high — всегда так; "" — не передавать, как решит claude
vault_tools = true      # даёт голове Read/Grep/Glob по хранилищу и по папке памяти (переписка по дням)
web_tools = true        # WebSearch/WebFetch: факт, которого нет в заметках и памяти, голова ищет в сети (D24)
skills = true           # навыки головы из head-skills/ (D33); в 🟥 — только мягкие
skill_dirs = []         # свои папки-плагины с навыками, например ["~/study-desk"]; только в обычном режиме

[roles.voice]           # L1: всё, что пишется в чат
model = "sonnet"

[web]                   # приложение: Mini App в Telegram, PWA на телефоне, `arvix` в терминале (05-INTERFACES §7)
enabled = true          # API внутри службы бота, слушает только 127.0.0.1
port = 8787
public_url = ""         # https-адрес снаружи (deploy/web-setup.sh пишет сам); пусто — кнопки приложения нет
token = ""              # ключ для PWA и терминала; пишет `arvix app token`

[weather]               # погоду код берёт у Open-Meteo по городу из профиля (profile_set city)
city = ""               # запасной город, если в профиле его нет

[roles.analyst]         # L2: разбор дня и недельное ретро, только в фоне
model = "sonnet"

[roles.stt]             # распознавание голосовых; для engine = "openai" — например "whisper-1"
model = "whisper-large-v3-turbo"

[roles.tts]             # голос Arvix для engine = "gemini" (бесплатный тариф AI Studio); экономнее — "gemini-3.8-flash-lite-tts"
model = "gemini-3.8-flash-tts"

# Голосовые сообщения в Telegram (05-INTERFACES §2.6). engine: off | groq | openai | command.
# Ключ пишет `arvix setup --stt groq` (скрытый ввод). command — своя программа на этой машине:
# {input} — присланный .ogg, {wav} — временный .wav; печатает текст в stdout (deploy/stt-local.sh).
[stt]
engine = "off"
api_key = ""
base_url = ""
language = "ru"
max_seconds = 300
timeout_sec = 90
command = ""
show_transcript = false   # true — перед ответом показывать «🎙 «…»»; по умолчанию бот просто отвечает

# Учебный блок в Telegram (06-LEARNING §8): задача сферы learning → урок по роадмапу.
[learning]
auto_lesson = true            # T+0 и ▶️ у учебной задачи присылают план блока; false — обычное «Блок пошёл»
check_questions = 3           # вопросов проверки в конце блока
tools = []                    # что ещё есть у человека, кроме названного в его заметках: ["Anki", "NotebookLM"]
concept_dir = ""              # папка для каркасов заметок; пусто — папка с «concept» в названии или [vault_paths] notes
concept_template = ""         # шаблон заметки; пусто — Templates/Concept.md из хранилища, если есть

[projects]                    # проекты (D43, 02-MECHANICS §14)
max_active = 3                # в работе одновременно; остальное — идеи и пауза

[obsidian]                    # ссылка «Открыть в Obsidian» из приложения (D47)
vault = ""                    # имя хранилища, как его видит Obsidian у тебя; пусто — имя папки [vault]

[mechanics]
sleep_target_min = 450        # 7.5 ч, 02-MECHANICS §5
sleep_night_end = "05:00"     # D48: действия до этого часа — ещё ночь (отбой), после — утро (подъём)
sleep_ask_until = "14:00"     # D48: утренний вопрос о сне — не позже; первое действие после — уже не подъём
deep_target_min = 120         # глубокая работа в день
week_budget_min = 1560        # 26 ч — месяц 1
week_deep_budget_min = 480    # 8 ч

[mechanics.quotas]            # недельные минимумы, 02-MECHANICS §8
sport = 3
social = 2
novelty = 1
offscreen = 3

[tts]                   # голос Arvix (D34, D36, D46): голосовое — только когда стоит послушать; голос в звонке
engine = "off"          # "gemini" — arvix setup --tts gemini (ключ AI Studio); "command" — своя команда (Piper)
voice = "Charon"        # мужские голоса Gemini: Charon, Orus, Iapetus, Algieba, Sadaltager, Puck, Fenrir…
command = ""
voice_replies = true    # голосовые в Telegram (voice_note головы, D46); false — только текст
voice_notes_per_day = 3 # не больше стольких голосовых в сутки
