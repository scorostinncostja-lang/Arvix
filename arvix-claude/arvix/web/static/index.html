<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Арвикс</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-title">
      <div id="top-day" class="top-day">Арвикс</div>
      <div id="top-sub" class="top-sub"></div>
    </div>
    <div class="top-right">
      <button id="top-call" class="top-call hidden" aria-label="Поговорить голосом"></button>
      <div id="top-mode" class="chip mode"></div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Арвикс</span></div>
    <button data-tab="today" class="active" title="Ctrl+1"><span class="ico" data-ic="today"></span><span>Сегодня</span><kbd>1</kbd></button>
    <button data-tab="chat" title="Ctrl+2"><span class="ico" data-ic="chat"></span><span>Арвикс</span><kbd>2</kbd><i id="chat-dot" class="dot hidden"></i></button>
    <button data-tab="notes" title="Ctrl+3"><span class="ico" data-ic="notes"></span><span>Заметки</span><kbd>3</kbd></button>
    <button data-tab="projects" title="Ctrl+4"><span class="ico" data-ic="projects"></span><span>Проекты</span><kbd>4</kbd></button>
    <button data-tab="progress" title="Ctrl+5"><span class="ico" data-ic="progress"></span><span>Прогресс</span><kbd>5</kbd></button>
    <div class="side-hint">Ctrl+1…5 — разделы<br>Alt+N — задача · / — поиск<br>Esc — закрыть</div>
  </nav>
</div>

<div id="sheet-back" class="sheet-back hidden"></div>
<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
